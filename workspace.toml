# 作業場の構成。PC 固有の値（Git の場所・旧資料の場所など）は workspace.local.toml（Git 管理外）に書く。
data = "_local"

[repos.ac3ds-re]
role = "analysis"
required = true
remote = "https://github.com/yak9909/ac3ds-re.git"
hooks = ".githooks"

# 派生リポジトリ（任意）。作ったら追記する。
