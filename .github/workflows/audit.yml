name: audit

on:
  push:
  pull_request:

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yak9909/ac3ds-re
          path: ac3ds-re
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit.py --ci
